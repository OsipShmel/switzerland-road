services:
  sandboxd:
    build:
      context: .
      dockerfile: Dockerfile

    init: true

    volumes:
      - sandboxd_ipc:/run/sandboxd
      - sandboxd_state:/var/lib/sandboxd/state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - SYS_PTRACE
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SETPCAP
      - SETFCAP
      - MKNOD
      - DAC_OVERRIDE
      - FOWNER
      - CHOWN
      - FSETID
      - KILL
      - AUDIT_WRITE
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
        net.ipv6.conf.default.disable_ipv6: 1

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      DOCKER_BUILDKIT: "1"
      # ----------------------------------------------------------------
      # Filesystem
      # ----------------------------------------------------------------

      SANDBOXD_PROJECT_ROOT: "${SANDBOXD_PROJECT_ROOT:-/app}"
      SANDBOXD_GATEWAY_LOGS_DIR: "${SANDBOXD_GATEWAY_LOGS_DIR:-/var/lib/sandboxd/gateway_logs}"
      SANDBOXD_TARGET_DIR: "${SANDBOXD_TARGET_DIR:-/app/apps/sandboxd/tests/target_app/juice-shop-master}"
      SANDBOXD_AGENT_DIR: "${SANDBOXD_AGENT_DIR:-/app/apps/sandboxd/tests/pentest_stub}"

      # ----------------------------------------------------------------
      # Dockerfiles
      # ----------------------------------------------------------------

      SANDBOXD_TARGET_DOCKERFILE: "${SANDBOXD_TARGET_DOCKERFILE:-Dockerfile}"
      SANDBOXD_AGENT_DOCKERFILE: "${SANDBOXD_AGENT_DOCKERFILE:-apps/pentest_agent/Dockerfile}"
      SANDBOXD_GATEWAY_DOCKERFILE: "${SANDBOXD_GATEWAY_DOCKERFILE:-apps/sandboxd/tests/gateway/Dockerfile}"
      SANDBOXD_LLM_EGRESS_DOCKERFILE: "${SANDBOXD_LLM_EGRESS_DOCKERFILE:-apps/sandboxd/tests/llm_egress/Dockerfile}"
      # ----------------------------------------------------------------
      # Networks
      # ----------------------------------------------------------------

      SANDBOXD_TARGET_NETWORK: "${SANDBOXD_TARGET_NETWORK:-sandbox-target-net}"
      SANDBOXD_CONTROL_NETWORK: "${SANDBOXD_CONTROL_NETWORK:-sandbox-control-net}"
      SANDBOXD_EGRESS_NETWORK: "${SANDBOXD_EGRESS_NETWORK:-sandbox-egress-net}"
      SANDBOXD_UPLINK_NETWORK: "${SANDBOXD_UPLINK_NETWORK:-sandbox-uplink-net}"

      # ----------------------------------------------------------------
      # Supervisor control plane
      # ----------------------------------------------------------------

      SANDBOXD_SUPERVISOR_URL: "${SANDBOXD_SUPERVISOR_URL:-http://supervisor:8000}"
      SANDBOXD_SUPERVISOR_TIMEOUT: "${SANDBOXD_SUPERVISOR_TIMEOUT:-10}"
      SANDBOXD_API_HOST: "${SANDBOXD_API_HOST:-0.0.0.0}"
      SANDBOXD_API_PORT: "${SANDBOXD_API_PORT:-8001}"
      SANDBOXD_CONTROL_SOCKET: "${SANDBOXD_CONTROL_SOCKET:-/run/sandboxd/control.sock}"
      SANDBOXD_STATE_DIR: "${SANDBOXD_STATE_DIR:-/var/lib/sandboxd/state}"

      # ----------------------------------------------------------------
      # Ports
      # ----------------------------------------------------------------

      SANDBOXD_AGENT_PORT: "${SANDBOXD_AGENT_PORT:-8080}"
      SANDBOXD_GATEWAY_PORT: "${SANDBOXD_GATEWAY_PORT:-9000}"
      SANDBOXD_LLM_EGRESS_PORT: "${SANDBOXD_LLM_EGRESS_PORT:-11434}"

      # ----------------------------------------------------------------
      # LLM
      # ----------------------------------------------------------------

      SANDBOXD_LLM_BRIDGE: "${SANDBOXD_LLM_BRIDGE:-1}"
      SANDBOXD_EGRESS_DELAY_MS: "${SANDBOXD_EGRESS_DELAY_MS:-100}"

      OPENAI_UPSTREAM_HOST: "${OPENAI_UPSTREAM_HOST:-deepcode.ci.nsu.ru}"
      OPENAI_UPSTREAM_PORT: "${OPENAI_UPSTREAM_PORT:-443}"
      OPENAI_UPSTREAM_PATH: "${OPENAI_UPSTREAM_PATH:-/api}"
      OPENAI_MODEL: "${OPENAI_MODEL:-Qwen3.8-27B}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-s}"

      # ----------------------------------------------------------------
      # Hash excludes
      # ----------------------------------------------------------------

      SANDBOXD_HASH_EXCLUDES: "${SANDBOXD_HASH_EXCLUDES:-sandboxd/tests/target,.git,.venv,__pycache__}"


    stdin_open: true
    tty: true
    stop_grace_period: 10s


    networks:
      - supervisor_uplink

networks:
  supervisor_uplink:
    name: ${SANDBOXD_UPLINK_NETWORK:-sandbox-uplink-net}
    external: true

volumes:
  sandboxd_ipc:
  sandboxd_state:
