services:
  supervisor:
    build:
      context: .
      dockerfile: apps/sandbox_supervisor/Dockerfile

    environment:
      SANDBOXD_URL: http://sandboxd:8001
      SECURITY_GATE_ALLOWED_REPOSITORY_HOSTS: ${SECURITY_GATE_ALLOWED_REPOSITORY_HOSTS:-github.com,gitlab.com,bitbucket.org}
      SECURITY_GATE_SEMGREP_CONFIG: ${SECURITY_GATE_SEMGREP_CONFIG:-p/sql-injection}
      SUPERVISOR_LOGS_DIR: /var/logs

    ports:
      - "8000:8000"

    networks:
      - sandbox_uplink

networks:
  sandbox_uplink:
    external: true
    name: ${SANDBOXD_UPLINK_NETWORK:-sandbox-uplink-net}
