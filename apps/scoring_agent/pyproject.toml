[project]
name = "scoring-agent"
version = "0.1.0"
description = "Context-aware SAST vulnerability scoring agent with NetworkX topology and LLM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "networkx>=3.3",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "vls",
]

[tool.uv.sources]
vls = { workspace = true }

[project.scripts]
scoring-agent = "scoring_agent.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
