[project]
name = "sandboxd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "docker>=7.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13",
    "setuptools>=84.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
sandboxd = "sandboxd:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
